{% extends "sticky_notes/base.html" %}

{% block title %}Delete {{ object.title }}{% endblock %}

{% block content %}
<section class="form-panel">
    <p class="eyebrow">You can't undo this action.</p>
    <h1>Delete Sticky Note?</h1>
    <p>Are you sure you want to delete? <strong>{{ object.title }}</strong>?</p>
    <form class="form-actions" method="post">
        {% csrf_token %}
        <button class="button button-danger" type="submit"> Yes, Delete Note</button>
        <a class="text-link" href="{% url 'sticky_note_detail' object.pk %}">Cancel</a>
    </form>
</section>
{% endblock %}
